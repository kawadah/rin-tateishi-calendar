# Go checks: lint, test, build. Runs on pushes to main and on pull requests.
name: Check

on:
  push:
    branches: [main]
    # Skip CI for changes that don't affect the build: docs and the
    # bot-updated data/ archive.
    paths-ignore: &skip
      - data/**
      - docs/**
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore: *skip

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: go golangci-lint

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build
