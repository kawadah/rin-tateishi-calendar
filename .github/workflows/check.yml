# Go checks: lint, test, build. Runs on pushes to main and on pull requests.
name: Check
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - LICENSE
  pull_request:
    paths-ignore: *docs

permissions: {}

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: go golangci-lint

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build
