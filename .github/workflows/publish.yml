# Fetches the source calendar, updates the durable archive under data/, and
# publishes the live .ics to Cloudflare R2.
#
# Required GitHub configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN   (scoped token with R2 read+write)
#              CLOUDFLARE_ACCOUNT_ID
#   Variables: R2_BUCKET              (e.g. rin-tateishi-calendar)
#              R2_OBJECT_KEY          (e.g. calendar.ics)
# Subscribers point their calendar app at https://<your-custom-domain>/<R2_OBJECT_KEY>.
name: Publish calendar

on:
  schedule:
    # Every 6 hours at 00/06/12/18 JST (Asia/Tokyo has no DST).
    - cron: 0 */6 * * *
      timezone: Asia/Tokyo
  workflow_dispatch:

# Serialize runs so the archive commit-back never races another run.
concurrency:
  group: publish
  cancel-in-progress: false

# Minimal default; each job opts into only what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to commit the updated data/ archive back
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: go

      - name: Run pipeline # fetch -> archive -> ics
        run: mise run pipeline

      - name: Commit archive changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "archive unchanged"
            exit 0
          fi

          git add data/
          git commit -m "chore(data): update archive [skip ci]"
          # Reconcile with any commits pushed since checkout, then push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload .ics artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calendar-ics
          path: dist/calendar.ics
          if-no-files-found: error

  # Upload runs with only read scope and no persisted git credentials, so the
  # write-scoped GITHUB_TOKEN is never present while wrangler (and its deps) run.
  upload:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: wrangler

      - name: Download .ics artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calendar-ics
          path: dist

      - name: Upload .ics to R2, skip if unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_OBJECT_KEY: ${{ vars.R2_OBJECT_KEY }}
        run: |
          set -euo pipefail
          : "${R2_BUCKET:?set repo variable R2_BUCKET}"
          : "${R2_OBJECT_KEY:?set repo variable R2_OBJECT_KEY}"
          : "${CLOUDFLARE_API_TOKEN:?set secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?set secret CLOUDFLARE_ACCOUNT_ID}"
          target="${R2_BUCKET}/${R2_OBJECT_KEY}"

          # Skip the upload when the published object already matches.
          if mise exec -- wrangler r2 object get "$target" --file current.ics --remote >/dev/null 2>&1 \
             && cmp -s current.ics dist/calendar.ics; then
            echo "published .ics is unchanged; skipping upload"
            exit 0
          fi

          mise exec -- wrangler r2 object put "$target" \
            --file dist/calendar.ics --remote \
            --content-type "text/calendar; charset=utf-8" \
            --cache-control "public, max-age=3600"
          echo "uploaded ${target}"

  # Independent contract canary: detect protocol drift early. Failing here (or a
  # failed publish) emails the repo watchers via GitHub's default notifications.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: go

      - name: Verify protocol
        run: mise run verify-protocol

      - name: Upload raw response on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-protocol-failure
          path: verify-protocol-failure.json
          if-no-files-found: ignore
