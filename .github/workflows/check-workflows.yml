# Lints the GitHub Actions workflows and the Dependabot config (actionlint + zizmor). Runs on pushes to main and on pull requests.
name: Check workflows

on:
  push:
    branches: [main]
    # Skip CI for changes that don't affect the build: docs and the
    # bot-updated data/ archive.
    paths-ignore: &skip
      - data/**
      - docs/**
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore: *skip

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: actionlint shellcheck zizmor

      - name: Check workflows and dependabot
        run: mise run check:workflows
