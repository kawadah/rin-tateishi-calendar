version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # 3-day cooldown is intentional; zizmor's dependabot-cooldown audit prefers >= 7.
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    # 3-day cooldown is intentional; zizmor's dependabot-cooldown audit prefers >= 7.
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown]
