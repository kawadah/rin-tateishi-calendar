[settings]
auto_install = false
minimum_release_age = "3d"
pin = true

[tools]
actionlint = "1"
go = "1"
golangci-lint = "2"
pinact = "4"
shellcheck = "0.11"
zizmor = "1"

[tasks.build]
description = "Compile all packages"
run = "go build ./..."

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format the code"
run = "golangci-lint fmt"

[tasks.tidy]
description = "Tidy go.mod/go.sum"
run = "go mod tidy"

[tasks.pipeline]
description = "Run the full pipeline once (fetch -> archive -> ics)"
run = "go run ./cmd/calendar"

[tasks.verify-protocol]
description = "Contract canary: check the /open/data protocol still decodes"
run = "go run ./cmd/verify-protocol"

[tasks.inspect-har]
description = "Locate the data request in a browser HAR export (pass a file path)"
run = "go run ./cmd/inspect-har"

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows + dependabot (actionlint + zizmor)"
run = ["actionlint", "zizmor .github"]
